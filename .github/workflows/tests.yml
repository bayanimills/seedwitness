name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a branch makes the run already in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt mpy-cross==1.27.0.post2
      # Eight test files gate on _build_mpy/ existing and silently skip
      # without it, so 29 tests never actually ran here, attestation and the
      # wordmark art among them. They only ran for whoever happened to have
      # built locally. Build first so the suite in CI is the whole suite.
      - name: Build the deploy tree the tests read
        run: ./tools/build_mpy.sh
      - name: Run desktop tests
        run: python -m pytest tests/ -q
      # The generator walks the real UI, so it breaks when a screen is added
      # to a flow and it is not taught about it. It broke exactly that way
      # once and went unnoticed: it jammed on a new warning screen and wrote
      # six different screenshots that were all the same screen. Nothing
      # ran it, so nothing said so. Exit code only, no image diffing:
      # VerifyBuildScreen renders a hash of the device tree and so changes
      # on every legitimate code change.
      - name: Screenshot generator still walks the flow
        run: python sim/capture_screens.py

  release-build:
    name: release build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned build tool
        run: python -m pip install mpy-cross==1.27.0.post2
      - name: Reproduce deploy tree
        run: ./tools/build_mpy.sh
      - name: Verify release manifest
        run: python tools/build_manifest.py --check manifest.json
      - name: Check whitespace
        run: git diff --check

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a branch makes the run already in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A squash merge gives the default branch a new SHA but, when the PR was up to date, the
  # same git tree the PR run already tested. Skip the jobs below on that push only when the
  # merged PR's head has the same tree and a successful run of this workflow. Any doubt
  # (no PR, tree differs, no green PR run, API error) runs them. Other events always run.
  dedupe-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      needed: ${{ steps.check.outputs.needed || 'true' }}
    steps:
      - id: check
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            let needed = true;
            try {
              const workflow = process.env.WORKFLOW_REF.split('@')[0].split('/.github/workflows/')[1];
              const base = context.payload.repository.default_branch;
              const { data: pulls } = await github.request('GET /repos/{owner}/{repo}/commits/{sha}/pulls', { owner, repo, sha, per_page: 100 });
              const pr = pulls.find((p) => p.merged_at && p.merge_commit_sha === sha && p.base.ref === base);
              if (workflow && pr) {
                const tree = async (commit_sha) => (await github.rest.git.getCommit({ owner, repo, commit_sha })).data.tree.sha;
                if ((await tree(pr.head.sha)) === (await tree(sha))) {
                  const { data } = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: workflow, head_sha: pr.head.sha, event: 'pull_request', per_page: 100 });
                  const runs = data.workflow_runs
                    .filter((r) => r.head_sha === pr.head.sha)
                    .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                  if (runs.length && runs[0].status === 'completed' && runs[0].conclusion === 'success') {
                    needed = false;
                    core.info(`Same tree as PR #${pr.number}, already passed: ${runs[0].html_url}`);
                  }
                }
              }
            } catch (error) {
              core.warning(`Dedupe check failed, running the jobs: ${error.message}`);
            }
            core.setOutput('needed', String(needed));

  test:
    needs: dedupe-check
    if: ${{ github.event_name != 'push' || needs.dedupe-check.outputs.needed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt mpy-cross==1.27.0.post2
      # Eight test files gate on _build_mpy/ existing and silently skip
      # without it, so 29 tests never actually ran here, attestation and the
      # wordmark art among them. They only ran for whoever happened to have
      # built locally. Build first so the suite in CI is the whole suite.
      - name: Build the deploy tree the tests read
        run: ./tools/build_mpy.sh
      - name: Run desktop tests
        run: python -m pytest tests/ -q
      # The generator walks the real UI, so it breaks when a screen is added
      # to a flow and it is not taught about it. It broke exactly that way
      # once and went unnoticed: it jammed on a new warning screen and wrote
      # six different screenshots that were all the same screen. Nothing
      # ran it, so nothing said so. Exit code only, no image diffing:
      # VerifyBuildScreen renders a hash of the device tree and so changes
      # on every legitimate code change.
      - name: Screenshot generator still walks the flow
        run: python sim/capture_screens.py

  release-build:
    needs: dedupe-check
    if: ${{ github.event_name != 'push' || needs.dedupe-check.outputs.needed == 'true' }}
    name: release build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned build tool
        run: python -m pip install mpy-cross==1.27.0.post2
      - name: Reproduce deploy tree
        run: ./tools/build_mpy.sh
      - name: Verify release manifest
        run: python tools/build_manifest.py --check manifest.json
      - name: Check whitespace
        run: git diff --check

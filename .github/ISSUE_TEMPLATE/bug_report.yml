name: Bug report
description: Report reproducible incorrect behaviour or a regression
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Never include a real seed phrase, passphrase, private key, roll sequence, descriptor, or xpub. Use published test vectors or disposable test data only. For vulnerabilities, stop here and follow SECURITY.md instead of filing a public issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: I removed all real wallet material and other sensitive data.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the incorrect behaviour and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use the smallest reproducible sequence and disposable test data.
      placeholder: |
        1. Start from ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the SeedWitness commit or release, CYD board revision, MicroPython version, host operating system, and whether this was physical hardware or the simulator.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Optional. Inspect every attachment for wallet material before uploading it.
